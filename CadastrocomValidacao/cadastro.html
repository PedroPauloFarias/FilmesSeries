<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Seu CSS -->
  <link rel="stylesheet" href="cadastro.css" />
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function FormularioRegistro() {
      const [formData, setFormData] = React.useState({
        nome: '',
        sobrenome: '',
        email: '',
        senha: '',
        confirmarSenha: '',
      });

      // Novo estado para erros
      const [erros, setErros] = React.useState({
        nome: '',
        sobrenome: '',
        email: '',
        senha: '',
        confirmarSenha: '',
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData({ ...formData, [name]: value });
        // Limpa o erro ao digitar
        if (erros[name]) {
          setErros({ ...erros, [name]: '' });
        }
      };

      // Função para validar os campos
      const validarCampos = () => {
        let valido = true;
        const novosErros = {
          nome: '',
          sobrenome: '',
          email: '',
          senha: '',
          confirmarSenha: '',
        };

        // Validação de campos obrigatórios
        if (!formData.nome.trim()) {
          novosErros.nome = 'O campo nome é obrigatório.';
          valido = false;
        }

        if (!formData.sobrenome.trim()) {
          novosErros.sobrenome = 'O campo sobrenome é obrigatório.';
          valido = false;
        }

        // Validação de e-mail
        if (!formData.email.trim()) {
          novosErros.email = 'O campo e-mail é obrigatório.';
          valido = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
          novosErros.email = 'O e-mail deve ser válido (ex: usuario@dominio.com).';
          valido = false;
        }

        // Validação de senha
        if (!formData.senha.trim()) {
          novosErros.senha = 'O campo senha é obrigatório.';
          valido = false;
        } else if (formData.senha.length < 6) {
          novosErros.senha = 'A senha deve ter pelo menos 6 caracteres.';
          valido = false;
        }

        // Validação de confirmação de senha
        if (formData.senha !== formData.confirmarSenha) {
          novosErros.confirmarSenha = 'As senhas não coincidem.';
          valido = false;
        }

        setErros(novosErros);
        return valido;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (validarCampos()) {
          console.log('Dados do usuário:', formData);
          alert('Cadastro realizado com sucesso!');
        }
      };

      return (
        <form className="form" onSubmit={handleSubmit}>
          <p className="title">Registro</p>
          <p className="message">Cadastre-se agora e tenha acesso total ao nosso site.</p>

          <div className="flex">
            <label>
              <input
                className="input"
                type="text"
                name="nome"
                value={formData.nome}
                onChange={handleChange}
              />
              <span>Nome</span>
              {erros.nome && <p className="erro">{erros.nome}</p>}
            </label>

            <label>
              <input
                className="input"
                type="text"
                name="sobrenome"
                value={formData.sobrenome}
                onChange={handleChange}
              />
              <span>Sobrenome</span>
              {erros.sobrenome && <p className="erro">{erros.sobrenome}</p>}
            </label>
          </div>

          <label>
            <input
              className="input"
              type="text"  // Mudei de "email" para "text" para evitar validação padrão do navegador
              name="email"
              value={formData.email}
              onChange={handleChange}
            />
            <span>E-mail</span>
            {erros.email && <p className="erro">{erros.email}</p>}
          </label>

          <label>
            <input
              className="input"
              type="password"
              name="senha"
              value={formData.senha}
              onChange={handleChange}
            />
            <span>Senha</span>
            {erros.senha && <p className="erro">{erros.senha}</p>}
          </label>

          <label>
            <input
              className="input"
              type="password"
              name="confirmarSenha"
              value={formData.confirmarSenha}
              onChange={handleChange}
            />
            <span>Confirme sua senha</span>
            {erros.confirmarSenha && <p className="erro">{erros.confirmarSenha}</p>}
          </label>

          <button className="submit">Enviar</button>
          <p className="signin">Já tem conta? <a href="#">Entrar</a></p>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FormularioRegistro />);
  </script>
</body>
</html>
